[project]
name = "generative-ui-backend"
version = "0.1.0"
description = "FastAPI backend for the Generative UI Platform: turns natural-language requests into validated UI schemas."
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "httpx>=0.27,<1.0",
    "pyjwt (>=2.9,<3.0)",
    "langgraph (>=0.2,<2.0)",
    "playwright (>=1.48,<2.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
pytest-asyncio = ">=0.25,<2.0"
ruff = ">=0.8"
mypy = ">=1.13"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The vocabulary is HTML, CSS and JavaScript held in Python strings: its lines are
# as long as the snippets are, and its typographic characters (×, –, ›) are intended.
"app/domains/references/vocabulary/*.py" = ["E501", "RUF001"]
"tests/unit/domains/test_vocabulary.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
# The local alembic/ directory holds migrations; the import is the installed package.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
