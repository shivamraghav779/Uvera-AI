server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The generated UI is rendered from data by this bundle only: no inline or remote scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src *; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths are handled by the app.
    location / {
        try_files $uri /index.html;
    }
}
